# Publishes site/ (home page, privacy policy, release history) and the web app built from web/
# into site/app/ to GitHub Pages on every push to main that touches them. Pull requests run the
# web app's checks and build without deploying.
name: Pages

on:
  push:
    branches: [main]
    paths: [site/**, web/**, .github/workflows/pages.yml]
  pull_request:
    paths: [web/**, .github/workflows/pages.yml]
  workflow_dispatch:

# Nothing by default; each job asks for what it needs.
permissions: {}

# A newer push waits for a running deploy instead of cutting it off halfway.
concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Actions pinned to a commit, so a moved tag cannot change what runs; Dependabot proposes
    # updates (.github/dependabot.yml).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Typecheck, lint, format, test
        working-directory: web
        run: npm run check
      # The web OAuth client id is public by nature (it ships in the page), so it is a
      # repository variable, not a secret; the repository itself keeps `temp` (docs/WEB.md).
      - name: Build
        working-directory: web
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: npm run build
      - name: Assemble the site
        run: cp -R web/dist site/app
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
